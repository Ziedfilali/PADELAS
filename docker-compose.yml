services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-mlops-n8n
    restart: unless-stopped
    ports:
      - "5680:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Africa/Tunis
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=http://localhost:5680/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows
    depends_on:
      - model-service

  model-service:
    build:
      context: .
      dockerfile: model-service/Dockerfile
    container_name: n8n-mlops-model-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_DRIVER=${DB_DRIVER}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_TRUST_CERT=${DB_TRUST_CERT}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - MODEL_BUCKET=${MODEL_BUCKET}
      - DATA_DIR=/app/data
      - NOTEBOOK_DIR=/app/notebooks
      - LOG_FILE=/app/logs/api.log
      - ENABLE_DEBUG_ENDPOINTS=true
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./notebooks:/app/notebooks
      - ./logs:/app/logs
    depends_on:
      - mlflow
      - minio

  web-app:
    image: nginx:alpine
    container_name: n8n-mlops-web-app
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./web-app:/usr/share/nginx/html:ro
      - ./web-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - model-service

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: n8n-mlops-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root s3://${MODEL_BUCKET}
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    container_name: n8n-mlops-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MODEL_BUCKET} || true;
      exit 0;
      "

volumes:
  n8n_data:
  mlflow_data:
  minio_data:
