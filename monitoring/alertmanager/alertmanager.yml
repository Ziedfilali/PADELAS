global:
  resolve_timeout: 5m
  # Webhook URL is read from the mounted file (see docker-compose).
  slack_api_url_file: "/etc/alertmanager/slack_webhook.url"

route:
  receiver: default-receiver
  group_by: ["alertname", "component"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-alerts
      group_wait: 0s
      repeat_interval: 5m
    - matchers:
        - severity="warning"
      receiver: warning-alerts
      group_wait: 30s
      repeat_interval: 1h

receivers:
  - name: default-receiver
    slack_configs:
      - channel: "#mlops-alerts"
        send_resolved: true
        color: "#439FE0"
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: |-
          {{ range .Alerts }}• *{{ .Annotations.summary }}*
          {{ .Annotations.description }}

          {{ end }}

  - name: critical-alerts
    slack_configs:
      - channel: "#mlops-alerts"
        send_resolved: true
        color: "danger"
        title: ":rotating_light: CRITICAL: {{ .GroupLabels.alertname }}"
        text: |-
          {{ range .Alerts }}• *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          `component={{ .Labels.component }}`

          {{ end }}

  - name: warning-alerts
    slack_configs:
      - channel: "#mlops-alerts"
        send_resolved: true
        color: "warning"
        title: ":warning: Warning: {{ .GroupLabels.alertname }}"
        text: |-
          {{ range .Alerts }}• *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          `component={{ .Labels.component }}`

          {{ end }}
