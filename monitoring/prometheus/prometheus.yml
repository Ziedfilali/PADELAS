global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "mlops-monitor"

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "mlops-api"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["model-service:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
